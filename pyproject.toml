[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "rpycdec"
authors = [{ name = "cnfatal", email = "cnfatal@gmail.com" }]
description = "A tool to decrypt .rpyc files"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
release = ["twine"]
sign = ["ecdsa"]
dev = ["ruff>=0.16.4,<0.17"]

[project.urls]
"Homepage" = "https://github.com/cnfatal/rpycdec"
"Bug Tracker" = "https://github.com/cnfatal/rpycdec/issues"

[project.scripts]
rpycdec = "rpycdec:main"

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/docs"]

[tool.hatch.build.targets.wheel]
packages = ["src/rpycdec", "src/renpy", "src/store"]

[tool.hatch.version]
source = "vcs"

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["src/renpy", "src/store"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP035"]

[tool.ruff.lint.per-file-ignores]
"src/rpycdec/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
