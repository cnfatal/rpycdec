[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "rpycdec"
authors = [{ name = "cnfatal", email = "cnfatal@gmail.com" }]
description = "Decompile Ren'Py compiled scripts (.rpyc, .rpymc) back to readable .rpy"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["renpy", "rpyc", "rpymc", "decompiler", "visual novel", "rpa"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Utilities",
]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
release = ["twine"]
sign = ["ecdsa"]
dev = ["ruff>=0.16.4,<0.17"]

[project.urls]
"Homepage" = "https://github.com/cnfatal/rpycdec"
"Bug Tracker" = "https://github.com/cnfatal/rpycdec/issues"

[project.scripts]
rpycdec = "rpycdec:main"

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/docs"]

[tool.hatch.build.targets.wheel]
packages = ["src/rpycdec", "src/renpy", "src/store"]

[tool.hatch.version]
source = "vcs"

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["src/renpy", "src/store"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP035"]

[tool.ruff.lint.per-file-ignores]
"src/rpycdec/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
